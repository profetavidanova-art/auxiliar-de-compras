<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#b40016">
  <meta name="description" content="Auxiliar de compras para comparar preços, montar listas e acompanhar economia.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>Auxiliar de Compras</title>
</head>
<body>
<header>
  <div>
    <h1>🛒 Auxiliar de Compras</h1>
    <p>Compare preços e monte sua compra inteligente.</p>
  </div>
</header>

<main>
  <nav class="tabs" aria-label="Seções">
    <button class="tab active" data-tab="lista">Lista de faltas</button>
    <button class="tab" data-tab="precos">Preços</button>
    <button class="tab" data-tab="compra">Minha compra</button>
    <button class="tab" data-tab="historico">Histórico</button>
  </nav>

  <section id="lista" class="panel active">
    <div class="card">
      <h2>Adicionar produto</h2>
      <form id="productForm">
        <input id="productName" required placeholder="Ex.: Arroz 5 kg">
        <input id="productQty" type="number" min="1" value="1" required>
        <button>Adicionar à lista</button>
      </form>
    </div>
    <div class="card">
      <div class="row-between"><h2>Produtos faltando</h2><button class="secondary" id="clearList">Limpar</button></div>
      <div id="listItems" class="list"></div>
    </div>
  </section>

  <section id="precos" class="panel">
    <div class="card">
      <h2>Cadastrar preço</h2>
      <form id="priceForm">
        <input id="priceProduct" required placeholder="Produto">
        <input id="storeName" required placeholder="Loja / atacado">
        <input id="priceValue" type="number" step="0.01" min="0" required placeholder="Preço (R$)">
        <button>Salvar preço</button>
      </form>
    </div>
    <div class="card">
      <h2>Preços cadastrados</h2>
      <div id="priceItems" class="list"></div>
    </div>
  </section>

  <section id="compra" class="panel">
    <div class="card">
      <h2>Compra inteligente</h2>
      <p class="muted">O sistema escolhe o menor preço cadastrado para cada produto da sua lista.</p>
      <div id="smartPurchase"></div>
      <div class="total" id="purchaseTotal"></div>
      <button id="finishPurchase">Registrar compra realizada</button>
    </div>
  </section>

  <section id="historico" class="panel">
    <div class="card">
      <h2>Resumo</h2>
      <div id="summary"></div>
    </div>
    <div class="card">
      <h2>Compras registradas</h2>
      <div id="historyItems" class="list"></div>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
